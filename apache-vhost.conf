<VirtualHost *:80>
    ServerName localhost

    # Alias for serving uploaded videos directly via Apache
    Alias /media /app/uploads
    <Directory /app/uploads>
        Require all granted
    </Directory>

    WSGIDaemonProcess web_service python-path=/app threads=5
    WSGIProcessGroup web_service
    WSGIScriptAlias / /app/web_service.wsgi process-group=web_service application-group=%{GLOBAL}

    <Directory /app>
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
