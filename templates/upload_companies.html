<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Companies CSV</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        h1 {
            margin: 0 0 1.5rem;
            font-size: 2rem;
        }
        .card {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            padding: 1.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
        }
        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-bottom: 0.75rem;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 0.85rem 1rem;
            margin-bottom: 1.25rem;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px dashed #475569;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button {
            background: #334155;
            color: #f8fafc;
            border: none;
            border-radius: 6px;
            padding: 0.45rem 0.9rem;
            margin-right: 1rem;
            font-weight: 500;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button:hover {
            background: #475569;
        }
        button[type="submit"] {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }
        button[type="submit"]:hover {
            background: #7dd3fc;
        }
        .links {
            display: flex;
            gap: 1.5rem;
            margin-top: 1.5rem;
            font-size: 0.95rem;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Upload Companies CSV</h1>
        <div class="card">
            <form method="post" action="/upload_companies" enctype="multipart/form-data">
                <label for="csv-file">CSV file</label>
                <input id="csv-file" type="file" name="file" accept=".csv,text/csv" required>
                <button type="submit">Upload CSV</button>
            </form>
        </div>
        <div class="links">
            <a href="/companies">View companies (JSON)</a>
            <a href="/">Video Gallery</a>
        </div>
    </div>
</body>
</html>
