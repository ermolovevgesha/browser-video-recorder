[project]
name = "browser-video-recorder"
version = "0.1.0"
description = "CSV-driven Browser Automation Video Recorder + Video Web Service"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "flask>=3.0.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "types-psycopg2>=2.9.21.20251012",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: verifies the running Docker Compose stack (ffmpeg and processing step)",
]
